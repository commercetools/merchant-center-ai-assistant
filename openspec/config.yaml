schema: spec-driven

context: |
  Project: open-source (commercetools-labs, MIT, UNSUPPORTED) single-tenant AI Assistant for the
  commercetools Merchant Center, deployed ONLY through commercetools Connect (no GitHub Actions).
  It is a migration of the multitenant solution found read-only at
  /Users/behnam/code/multitenant-ai-assistant/{multitenant-chat-app,multitenant-ai-assistant-router}.
  Read plans/00-overview.md, plans/02-target-architecture.md and plans/03-spec-dependency-map.md
  before authoring any change; the change IDs A..Z there are authoritative.
  Fixed decisions: Firestore removed -> commercetools Custom Objects (plans/05-data-persistence.md);
  Gemini via Vertex AI with GCP_SA_KEY_BASE64 (Base64 of the whole service-account JSON);
  Nimbus MCP gateway embedded in the service; identity-mode Managed MCP kept;
  the old "cms" package is not used. Layout follows the commercetools-connect skill
  (service/, mc-app/, composed-apps/, mc-view-app/ at repo root, one connect.yaml, no npm workspaces).
  Package names are @commercetools-labs/<name>; every source file carries the SPDX MIT header.
  Do not copy customer names, internal hostnames, GCP project ids, secrets or demo framing into any file.
  Anything that needs the owner goes to plans/owner-questions.md; anything the owner must do by hand goes to
  plans/manual-steps.md. Agents test with the Chrome DevTools MCP rather than asking the owner to click.

rules:
  proposal:
    - State the change ID (A..Z) and its Needs (dependencies) from plans/03-spec-dependency-map.md.
    - Always include an "Out of scope" section and a "Legacy source" section with absolute source paths.
  design:
    - Include "Explore findings" (facts with file/line or doc-URL citations), "Glossary", "Source map" (legacy file -> new file -> KEEP/CHANGE/DROP), "Decisions" (with alternatives considered), "Risks", and "Open questions" (owner-only ones are mirrored in plans/owner-questions.md).
    - Verify platform facts with the commercetools Knowledge MCP instead of assuming; cite the doc URL.
  specs:
    - Requirements use SHALL/MUST; every requirement has at least one WHEN/THEN scenario that can be checked by a test or a Chrome scenario.
  tasks:
    - Write for a junior developer who has never seen the legacy code. Follow the shape in plans/04-workflow.md section 3 exactly.
    - Each task is at most about 2 hours, names exact file paths (new path and the absolute legacy path to copy from), gives commands with expected output, code or YAML skeletons where the shape is non-obvious, a "Done when" check, and a "Watch out" note.
    - Start with "0. Read first" and end with "Verification" listing the exact tests and Chrome scenario ids.
    - Include a "Docs to update" bullet list for change W.

operations:
  apply:
    guidance:
      - Never modify the legacy repos. Copy, then edit.
      - Run the Definition of Done in plans/04-workflow.md before ticking the last task.
  archive:
    guidance:
      - Summarise the archive outcome and name the next spec(s) unblocked by it.
