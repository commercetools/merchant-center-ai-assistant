query FetchComposedPages(
  $container: String!
  $limit: Int!
  $offset: Int!
  $sort: [String!]
) {
  customObjects(
    container: $container
    limit: $limit
    offset: $offset
    sort: $sort
  ) {
    total
    count
    offset
    results {
      id
      key
      container
      value
      version
      createdAt
      lastModifiedAt
    }
  }
}
