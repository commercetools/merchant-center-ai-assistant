query FetchComposedPages($container: String!, $limit: Int!, $offset: Int!) {
  customObjects(
    container: $container
    limit: $limit
    offset: $offset
  ) {
    total
    count
    offset
    results {
      id
      key
      container
      value
      version
      createdAt
      lastModifiedAt
    }
  }
}
