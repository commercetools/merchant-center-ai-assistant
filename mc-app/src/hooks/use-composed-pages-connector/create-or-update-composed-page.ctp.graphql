mutation CreateOrUpdateComposedPage(
  $container: String!
  $key: String!
  $value: String!
) {
  createOrUpdateCustomObject(
    draft: { container: $container, key: $key, value: $value }
  ) {
    id
    key
    container
    value
    version
    createdAt
    lastModifiedAt
  }
}
