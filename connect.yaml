# Platform environment contract (verified facts, see openspec change b-connect-skeleton, design "Platform facts")
#
# 1. inheritAs: the top-level `inheritAs.apiClient` block at the end of this file makes Connect generate ONE
#    API client for the whole connector and inject exactly CTP_API_URL, CTP_AUTH_URL, CTP_CLIENT_ID,
#    CTP_CLIENT_SECRET, CTP_PROJECT_KEY and CTP_SCOPE. Never declare these six keys under `configuration`.
#    CTP_REGION is NOT injected: the service entry declares it as a standard configuration key.
# 2. CONNECT_SERVICE_URL (the public URL of a service) exists only inside the postDeploy / preUndeploy scripts,
#    not in the running service. The service URL is therefore unknown until the first deployment, so
#    MC_AUDIENCE and CHAT_SERVICE_ENDPOINT_URL are set by a configuration redeploy (change U, two-phase deploy).
# 3. APPLICATION_URL is injected by Connect for the Merchant Center applications and the view; it must not be
#    declared here. The config files use '${env:APPLICATION_URL}'.
deployAs:
  - name: mc-app
    applicationType: merchant-center-custom-application
    configuration:
      standardConfiguration:
        - key: CUSTOM_APPLICATION_ID
          description: The Custom Application ID returned when registering the application in the Merchant Center
          required: true
        - key: ENTRY_POINT_URI_PATH
          description: Entry point URI path of the Custom Application (unique per cloud region)
          required: true
        - key: CLOUD_IDENTIFIER
          description: Merchant Center API cloud identifier (for example gcp-us)
          default: 'gcp-us'
        - key: CHAT_SERVICE_ENDPOINT_URL
          description: Full URL of the service including /service; set on redeploy after the first deployment
          required: false
          default: 'https://not-configured.invalid/service'
  - name: mc-view-app
    applicationType: merchant-center-custom-view
    configuration:
      standardConfiguration:
        - key: CUSTOM_VIEW_ID
          description: The Custom View ID returned when registering the view in the Merchant Center
          required: true
        - key: CLOUD_IDENTIFIER
          description: Merchant Center API cloud identifier (for example gcp-us)
          default: 'gcp-us'
        - key: CHAT_SERVICE_ENDPOINT_URL
          description: Full URL of the service including /service; set on redeploy after the first deployment
          required: false
          default: 'https://not-configured.invalid/service'
inheritAs:
  apiClient:
    scopes:
      - view_key_value_documents
      - manage_key_value_documents
